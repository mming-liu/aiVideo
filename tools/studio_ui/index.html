<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiVideo Studio · 审校工作台</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --panel-2:#1b232e; --line:#26303d;
    --text:#e6edf3; --muted:#8b98a8; --accent:#4f9cf9; --ok:#3fb950;
    --warn:#d29922; --bad:#f85149; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  a{color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);padding:6px 12px;transition:.15s}
  button:hover{border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  button.ghost{background:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.on{color:var(--ok);border-color:rgba(63,185,80,.45)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header.top{position:sticky;top:0;z-index:10;display:flex;gap:16px;align-items:center;
    padding:12px 20px;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .pill{font-size:11px;font-weight:500;color:var(--ok);border:1px solid rgba(63,185,80,.4);
    background:rgba(63,185,80,.08);border-radius:999px;padding:1px 8px}
  .meta{color:var(--muted);font-size:12px;flex:1;min-width:200px}
  .meta b{color:var(--text);font-weight:600}
  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;
    border:1px solid var(--line);margin-left:6px}
  .badge.ok{color:var(--ok);border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.08)}
  .badge.warn{color:var(--warn);border-color:rgba(210,153,34,.45);background:rgba(210,153,34,.08)}
  .badge.bad{color:var(--bad);border-color:rgba(248,81,73,.45);background:rgba(248,81,73,.08)}
  nav.tabs{display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
  nav.tabs button{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;color:var(--muted)}
  nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--text);border-color:var(--line);border-bottom-color:var(--panel)}
  nav.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px}
  nav.tabs button .dot.off{background:var(--line)}
  main{padding:16px 20px 80px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:12px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .card-head h3{margin:0;font-size:15px}
  .idx{font-family:ui-monospace,Consolas,monospace;color:var(--accent);font-weight:700}
  .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .field{margin:8px 0}
  .field .k{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
  .field .v{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .field .v.empty{color:var(--muted);font-style:italic}
  .table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  table.shots{border-collapse:collapse;width:100%;font-size:12.5px}
  table.shots th{position:sticky;top:0;z-index:1;background:var(--panel-2);color:var(--muted);
    text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.shots td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:300px}
  table.shots tbody tr:hover td{background:rgba(255,255,255,.025)}
  .cell{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    white-space:pre-wrap;overflow-wrap:anywhere;cursor:default}
  .cell.muted{color:var(--muted)}
  .cell[title]{cursor:zoom-in}
  .cell.open{-webkit-line-clamp:unset;display:block;cursor:zoom-out}
  tr.edit-row td{background:var(--panel-2)}
  .edit-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  textarea{width:100%;min-height:76px;background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.55 inherit;resize:vertical}
  textarea:focus{border-color:var(--accent);outline:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .frames{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){.frames{grid-template-columns:1fr}}
  .frame{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .frame img{width:100%;height:auto;border-radius:8px;background:#000;display:block;cursor:zoom-in}
  .frame .ph{height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:8px;font-size:12px}
  .hash{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--muted);font-size:12px}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a0e14;border:1px solid var(--line);
    border-radius:8px;padding:10px;font-size:12px;max-height:340px;overflow:auto}
  .empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#e6edf3;color:#0d1117;
    padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--bad);color:#fff}
  .list{display:grid;gap:8px}
  .list .item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel-2);font-size:13px}
  .list .item .n{font-family:ui-monospace,Consolas,monospace;color:var(--accent);min-width:64px}
  .list .item .p{flex:1;overflow-wrap:anywhere;color:var(--muted);font-size:12px}
  .plan-reasons{margin:0;padding-left:16px;color:var(--muted);font-size:12px}
  .plan-reasons li{margin:2px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand">aiVideo Studio <span class="pill">model_sends = 0</span></div>
  <div class="meta" id="meta">加载中…</div>
  <div class="actions">
    <span id="updated" class="sub"></span>
    <button id="auto" class="ghost on" type="button" title="每 5 秒自动拉取一次产物状态">自动刷新：开</button>
    <button id="refresh" class="ghost" type="button">刷新</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"><div class="empty">加载中…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";

  var state = { overview: null, tab: "step01", editing: {}, busy: false,
                auto: true, sig: null };
  var TABS = [
    { id: "step01", label: "01 分镜" },
    { id: "step02a", label: "02a 首尾帧" },
    { id: "step02b", label: "02b 视频" },
    { id: "step03", label: "03 语音" },
    { id: "step04", label: "04 成片" },
    { id: "cost", label: "费用准备" }
  ];

  function h(tag, props, kids) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.keys(v).forEach(function (d) { el.dataset[d] = v[d]; });
      else el.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (kid) {
      if (kid === null || kid === undefined || kid === false) return;
      el.appendChild(typeof kid === "string" || typeof kid === "number"
        ? document.createTextNode(String(kid)) : kid);
    });
    return el;
  }

  function toast(msg, isErr) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.className = "toast"; }, 2600);
  }

  function api(path, body) {
    var opts = { headers: {} };
    if (body !== undefined) {
      opts.method = "POST";
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return { ok: false, message: "响应不是 JSON" }; })
        .then(function (data) {
          if (!res.ok || data.ok === false) {
            var err = new Error(data.message || ("HTTP " + res.status));
            err.code = data.code;
            err.data = data;
            throw err;
          }
          return data;
        });
    });
  }

  function mediaUrl(path) { return "/media?path=" + encodeURIComponent(path); }

  function shortHash(v) { return v ? String(v).slice(0, 12) : "—"; }

  function fieldView(label, value) {
    var text = value === null || value === undefined || value === "" ? "（空）" : value;
    if (typeof value === "object") text = JSON.stringify(value, null, 2);
    return h("div", { class: "field" }, [
      h("div", { class: "k", text: label }),
      h("div", { class: "v" + (text === "（空）" ? " empty" : ""), text: text })
    ]);
  }

  // ---------------------------------------------------------------- 顶部
  function renderMeta(ov) {
    var ch = ov.chapter, gate = ov.gate, c = ov.counts;
    var meta = document.getElementById("meta");
    meta.textContent = "";
    meta.appendChild(h("span", {}, [
      h("b", { text: ch.novel || "?" }),
      " · 第 " + (ch.book_index || "?") + " 部《" + (ch.book_name || "?") + "》",
      " · 第 " + (ch.chapter || "?") + " 章"
    ]));
    var badge = h("span", {
      class: "badge " + (gate.verified ? "ok" : (gate.status === "COMMITTED" ? "warn" : "bad")),
      text: "门禁 " + (gate.status || "?") + (gate.verified ? " · 已验证" : " · 未验证")
    });
    meta.appendChild(badge);
    meta.appendChild(h("span", { class: "badge", text: "镜头 " + c.shots + " · 锁定 " + c.kept }));
    meta.appendChild(h("span", { class: "badge ok", text: "帧命中 " + c.frames_cached }));
    if (c.frames_stale) meta.appendChild(h("span", { class: "badge warn", text: "待更新 " + c.frames_stale }));
    if (c.frames_missing) meta.appendChild(h("span", { class: "badge", text: "缺帧 " + c.frames_missing }));
  }

  function renderTabs(ov) {
    var nav = document.getElementById("tabs");
    nav.textContent = "";
    var byId = {};
    (ov.steps || []).forEach(function (s) { byId[s.id] = s; });
    TABS.forEach(function (t) {
      var step = byId[t.id] || {};
      var btn = h("button", {
        type: "button",
        "aria-selected": String(state.tab === t.id),
        title: step.detail || "",
        onclick: function () { state.tab = t.id; render(); }
      }, [
        h("span", { class: "dot" + (step.available ? "" : " off") }),
        t.label
      ]);
      nav.appendChild(btn);
    });
  }

  // ---------------------------------------------------------------- 01
  // 单元格：长文本折叠，点击展开/收起（避免整页被 JSON/长句撑爆）
  function cellText(value, muted) {
    var text = (value === null || value === undefined || value === "") ? "—" : String(value);
    var div = h("div", { class: "cell" + (muted ? " muted" : ""), text: text });
    if (text.length > 36) {
      div.title = "点击展开 / 收起";
      div.addEventListener("click", function () {
        div.classList.toggle("open");
      });
    }
    return div;
  }

  // 角色布局：把结构化数据翻成人话，视图里不出现 JSON
  function layoutText(layout) {
    if (!layout || typeof layout !== "object") return "—";
    var parts = [];
    ["ff", "lf"].forEach(function (k) {
      var list = layout[k];
      if (!Array.isArray(list) || !list.length) return;
      var names = list.filter(function (p) { return p && p.on_screen !== false; })
        .map(function (p) {
          var bits = [p.name || "?"];
          if (p.position) bits.push("·" + p.position);
          if (p.pose) bits.push("·" + p.pose);
          return bits.join("");
        });
      if (names.length) parts.push((k === "ff" ? "首" : "尾") + "：" + names.join("，"));
    });
    if (Array.isArray(layout.kfs) && layout.kfs.length) parts.push("关键帧 " + layout.kfs.length + " 组");
    return parts.length ? parts.join("；") : "—";
  }

  // ---------------------------------------------------------------- 01
  function renderStep01(ov) {
    var view = document.getElementById("view");
    view.textContent = "";
    view.appendChild(h("div", { class: "card" }, [
      h("div", { class: "row" }, [
        h("div", { class: "sub", text: "表格逐镜对照：台词/旁白只读，画面字段可改；保存会重建四份门禁（model_sends = 0），失败不覆盖基线。长文本点一下展开。" }),
        h("div", { class: "spacer" }),
        h("button", { type: "button", class: "ghost", text: "重算 02a 预检", onclick: runPlan })
      ])
    ]));

    // X5：CP1–CP4 断点状态（随 overview 每 5 秒轮询自动更新，不用翻 snapshots/）
    var cps = (ov.checkpoints && ov.checkpoints.stages) || {};
    var cpBox = h("div", { class: "row", style: "flex-wrap:wrap;gap:8px;margin-top:8px" });
    ["CP1_PLAN_VERIFIED", "CP2_CANDIDATE_GENERATED",
     "CP3_INITIAL_AUDIT_DONE", "CP4_REPAIR_ROUND_K_DONE"].forEach(function (name) {
      var st = cps[name] || {};
      var tip = st.present
        ? (st.key + " · " + (st.written_at || "") + " · rev " + (st.revision || ""))
        : "未到达";
      cpBox.appendChild(h("span", {
        class: "badge " + (st.present ? "ok" : ""),
        title: tip,
        text: name.split("_")[0] + (st.present ? " ✅" : " ⚪")
      }));
    });
    view.appendChild(h("div", { class: "card" }, [
      h("div", { class: "row" }, [
        h("b", { text: "断点（CP1–CP4）" }),
        h("div", { class: "spacer" }),
        h("span", { class: "sub", text: (ov.checkpoints && ov.checkpoints.index_path) || "尚无检查点" })
      ]),
      cpBox
    ]));

    var table = h("table", { class: "shots" });
    table.appendChild(h("thead", {}, [h("tr", {}, [
      h("th", { text: "镜号" }), h("th", { text: "时长" }), h("th", { text: "台词 / 旁白" }),
      h("th", { text: "运镜" }), h("th", { text: "首帧" }), h("th", { text: "尾帧" }),
      h("th", { text: "动作差分" }), h("th", { text: "角色布局" }), h("th", { text: "状态" }),
      h("th", { text: "操作" })
    ])]));
    var tbody = h("tbody", {});

    (ov.shots || []).forEach(function (shot) {
      var editing = state.editing[shot.index];
      var tr = h("tr", {});
      tr.appendChild(h("td", {}, [h("b", { class: "idx", text: "#" + shot.index })]));
      tr.appendChild(h("td", { text: shot.duration ? shot.duration + "s" : "—" }));
      tr.appendChild(h("td", {}, [
        shot.subtitle ? cellText(shot.subtitle) : h("div", { class: "cell muted", text: "—" }),
        shot.narration ? h("div", { class: "cell muted", style: "margin-top:4px", text: "旁白：" + shot.narration }) : null
      ]));
      tr.appendChild(h("td", {}, [cellText(shot.fields.camera_movement)]));
      tr.appendChild(h("td", {}, [cellText(shot.fields.ff_desc)]));
      tr.appendChild(h("td", {}, [cellText(shot.fields.lf_desc)]));
      tr.appendChild(h("td", {}, [cellText(shot.fields.motion_desc)]));
      tr.appendChild(h("td", {}, [cellText(layoutText(shot.fields.frame_layouts))]));
      tr.appendChild(h("td", {}, [
        shot.keep ? h("span", { class: "badge ok", text: "🔒 锁定" })
                  : h("span", { class: "badge", text: "可改" }),
        h("div", { class: "hash", text: shortHash(shot.revision) }),
        shot.media_policy ? h("div", { class: "hash", text: shot.media_policy.mode || "" }) : null
      ]));
      tr.appendChild(h("td", {}, [
        h("div", { class: "row", style: "gap:6px" }, [
          h("button", {
            type: "button", class: "ghost",
            text: shot.keep ? "解锁" : "锁定",
            onclick: function () { toggleKeep(shot); }
          }),
          h("button", {
            type: "button", text: editing ? "收起" : "修改",
            onclick: function () {
              if (editing) delete state.editing[shot.index];
              else state.editing[shot.index] = true;
              render();
            }
          })
        ])
      ]));
      tbody.appendChild(tr);

      if (editing) {
        var drafts = editing === true ? {} : editing;
        state.editing[shot.index] = drafts;
        tbody.appendChild(editorRow(shot, drafts));
      }
    });

    table.appendChild(tbody);
    view.appendChild(h("div", { class: "table-wrap" }, [table]));
  }

  function editorRow(shot, drafts) {
    var tr = h("tr", { class: "edit-row" });
    var td = h("td", { colspan: 10 });
    td.appendChild(h("div", { class: "edit-head" }, [
      h("b", { text: "编辑 shot #" + shot.index }),
      h("span", { class: "sub", text: "只改画面字段；时长 / 字幕 / 旁白 / plan_refs 等锁定合同字段不接受修改。" })
    ]));
    ["prompt", "ff_desc", "lf_desc", "motion_desc", "camera_movement"].forEach(function (key) {
      var box = h("textarea", { rows: key === "prompt" ? 4 : 3 });
      box.value = shot.fields[key] || "";
      box.addEventListener("input", function () { drafts[key] = box.value; });
      td.appendChild(h("div", { class: "field" }, [
        h("div", { class: "k", text: key }),
        box
      ]));
    });
    var wrap = h("div", {});
    ["frame_layouts", "keyframes"].forEach(function (key) {
      var box = h("textarea", { rows: 6 });
      box.value = JSON.stringify(shot.fields[key] || (key === "keyframes" ? [] : {}), null, 2);
      box.addEventListener("input", function () {
        try { drafts[key] = JSON.parse(box.value); box.style.borderColor = ""; }
        catch (e) { box.style.borderColor = "var(--bad)"; }
      });
      wrap.appendChild(h("div", { class: "field" }, [
        h("div", { class: "k", text: key }),
        box
      ]));
    });
    td.appendChild(h("details", {}, [
      h("summary", { text: "结构化字段（frame_layouts / keyframes，仅编辑时按 JSON 提交）" }),
      wrap
    ]));
    td.appendChild(h("div", { class: "row", style: "margin-top:10px" }, [
      h("button", { type: "button", class: "primary", text: "预检（dry-run）", onclick: function () { patchShot(shot, drafts, false); } }),
      h("button", { type: "button", text: "保存并重签门禁", onclick: function () { patchShot(shot, drafts, true); } }),
      h("button", { type: "button", class: "ghost", text: "取消", onclick: function () { delete state.editing[shot.index]; render(); } })
    ]));
    tr.appendChild(td);
    return tr;
  }

  // ---------------------------------------------------------------- 02a
  function renderStep02a(ov) {
    var view = document.getElementById("view");
    view.textContent = "";
    view.appendChild(h("div", { class: "card" }, [
      h("div", { class: "row" }, [
        h("div", { class: "sub", text: "「保持此图」把当前内容哈希写回 *_hash.txt（0 成本消除待更新）；「标记重抽」先备份再移除旧图与哈希，预检随即判 generate。" }),
        h("div", { class: "spacer" }),
        h("button", { type: "button", class: "ghost", text: "重算预检", onclick: runPlan })
      ])
    ]));

    (ov.shots || []).forEach(function (shot) {
      var card = h("div", { class: "card" });
      card.appendChild(h("div", { class: "card-head" }, [
        h("span", { class: "idx", text: "#" + shot.index }),
        h("span", { class: "sub", text: (shot.subtitle || "").slice(0, 60) }),
        h("div", { class: "spacer" }),
        shot.keep ? h("span", { class: "badge ok", text: "已锁定" }) : null
      ]));
      var grid = h("div", { class: "frames" });
      ["ff", "lf"].forEach(function (kind) {
        var frame = shot.frames[kind] || {};
        var label = kind === "ff" ? "首帧" : "尾帧";
        var stateText = frame.state === "cached" ? "🟢 命中" : (frame.state === "stale" ? "🟡 待更新" : "⚪ 缺失");
        var badgeCls = frame.state === "cached" ? "ok" : (frame.state === "stale" ? "warn" : "");
        var box = h("div", { class: "frame" }, [
          h("div", { class: "row" }, [
            h("b", { text: label }),
            h("span", { class: "badge " + badgeCls, text: stateText }),

  // X5-03：把 /api/plan 的报告翻成逐镜 ready/blocked。只做展示，不改判据。
  // 优先读后端显式 verdict/status/ready；缺失时按 shot_frames 的
  // generate/cached/locked 与 prompt/visual-plan 问题派生，兼容结构演进。
  function planRows(rep) {
    rep = rep || {};
    var by = {};
    function ensure(idx) {
      var key = String(idx);
      if (!by[key]) {
        by[key] = { shot: idx, reasons: [], frames: {}, cached: 0, locked: 0 };
      }
      return by[key];
    }
    function reason(row, text) {
      text = String(text || "").trim();
      if (text && row.reasons.indexOf(text) < 0) row.reasons.push(text);
    }
    function problemText(p) {
      if (typeof p === "string") return p;
      if (!p || typeof p !== "object") return "";
      return [p.code, p.message].filter(Boolean).join("：");
    }
    function addExplicit(row, entry) {
      if (!entry || typeof entry !== "object") return;
      var verdict = String(entry.verdict || entry.status || "").toLowerCase();
      var bad = entry.blocked === true || entry.ready === false ||
                verdict === "blocked" || verdict === "failed";
      if (bad) {
        reason(row, problemText(entry) ||
          ("后端判定 " + (verdict || "blocked")));
      }
      var list = entry.problems || entry.issues || entry.reasons ||
                 entry.blocked_reasons;
      if (Array.isArray(list)) {
        list.forEach(function (p) {
          reason(row, problemText(p) || "后端问题");
        });
      }
    }
    var frameRows = Array.isArray(rep.shot_frames) ? rep.shot_frames : [];
    frameRows.forEach(function (fr) {
      if (!fr || typeof fr !== "object") return;
      var row = ensure(fr.shot);
      ["ff", "lf"].forEach(function (k) {
        var st = fr[k];
        if (!st) return;
        row.frames[k] = st;
        if (st === "generate") {
          reason(row, (k === "ff" ? "首帧" : "尾帧") + "需生成");
        } else if (st === "locked") {
          row.locked += 1;
        } else if (st === "cached") {
          row.cached += 1;
        } else {
          reason(row, (k === "ff" ? "首帧" : "尾帧") + "状态 " + st);
        }
      });
      if (fr.kf && typeof fr.kf === "object") {
        var exp = Number(fr.kf.expected || 0);
        var got = Number(fr.kf.cached || 0);
        row.frames.kf = got + "/" + exp;
        if (got < exp) reason(row, "关键帧缺 " + (exp - got) + " 张");
      }
    });
    var visual = rep.visual_plan || {};
    var visualShots = Array.isArray(visual.shots) ? visual.shots : [];
    visualShots.forEach(function (s) {
      if (!s || s.shot_index === undefined) return;
      var row = ensure(s.shot_index);
      addExplicit(row, s);
      if (String(s.status || "").toLowerCase() === "blocked" &&
          !(Array.isArray(s.issues) && s.issues.length)) {
        reason(row, "视觉计划阻断");
      }
    });
    var promptProblems = (rep.prompt_preflight &&
      Array.isArray(rep.prompt_preflight.problems))
      ? rep.prompt_preflight.problems : [];
    promptProblems.forEach(function (p) {
      if (!p || p.shot === null || p.shot === undefined) return;
      reason(ensure(p.shot), "提示组装 " +
        [p.frame, problemText(p)].filter(Boolean).join("："));
    });
    var planIssues = Array.isArray(rep.visual_plan_issues)
      ? rep.visual_plan_issues : [];
    planIssues.forEach(function (p) {
      if (!p || typeof p !== "object") return;
      var m = /shots\[(\d+)\]/.exec(String(p.path || ""));
      if (m) reason(ensure(Number(m[1])), problemText(p));
    });
    var shotList = Array.isArray(rep.shots) ? rep.shots : [];
    shotList.forEach(function (s) {
      if (s && typeof s === "object") {
        var idx = s.shot_index !== undefined ? s.shot_index : s.shot;
        if (idx === undefined || idx === null) return;
        addExplicit(ensure(idx), s);
      } else if (s !== null && s !== undefined) {
        ensure(s);
      }
    });
    var rows = Object.keys(by).map(function (k) { return by[k]; });
    rows.forEach(function (row) {
      row.status = row.reasons.length ? "blocked" : "ready";
    });
    rows.sort(function (a, b) { return Number(a.shot) - Number(b.shot); });
    return rows;
  }

  function planHasShotDetail(rep) {
    rep = rep || {};
    if (Array.isArray(rep.shot_frames) && rep.shot_frames.length) return true;
    if (rep.visual_plan && Array.isArray(rep.visual_plan.shots) &&
        rep.visual_plan.shots.length) return true;
    return Array.isArray(rep.shots) && rep.shots.some(function (s) {
      return s && typeof s === "object";
    });
  }

  function renderPlanReport(res) {
    var rep = (res && res.report) || {};
    var totals = rep.totals || {};
    var rows = planHasShotDetail(rep) ? planRows(rep) : [];
    var ready = rows.filter(function (r) { return r.status === "ready"; }).length;
    var blocked = rows.length - ready;
    var body;
    if (rows.length) {
      var table = h("table", { class: "shots" });
      table.appendChild(h("thead", {}, [h("tr", {}, [
        h("th", { text: "镜号" }), h("th", { text: "状态" }),
        h("th", { text: "blocked 原因" }), h("th", { text: "02a 帧" })
      ])]));
      var tbody = h("tbody", {});
      rows.forEach(function (row) {
        var badge = row.status === "ready"
          ? h("span", { class: "badge ok", text: "ready" })
          : h("span", { class: "badge bad", text: "blocked" });
        var reasons = row.reasons.length
          ? h("ul", { class: "plan-reasons" }, row.reasons.map(function (text) {
              return h("li", { text: text });
            }))
          : h("span", { class: "sub", text: "—" });
        var frameText = ["ff", "lf"].map(function (k) {
          if (!row.frames[k]) return null;
          var label = k === "ff" ? "首帧" : "尾帧";
          var st = row.frames[k] === "generate" ? "待生成"
            : (row.frames[k] === "locked" ? "锁保" : "命中");
          return label + "：" + st;
        }).filter(Boolean).join(" · ");
        if (row.frames.kf) {
          frameText += (frameText ? " · " : "") + "关键帧 " + row.frames.kf;
        }
        tbody.appendChild(h("tr", {}, [
          h("td", {}, [h("b", { class: "idx", text: "#" + row.shot })]),
          h("td", {}, [badge]),
          h("td", {}, [reasons]),
          h("td", {}, [h("div", { class: "sub", text: frameText || "—" })])
        ]));
      });
      table.appendChild(tbody);
      body = h("div", { class: "table-wrap" }, [table]);
    } else {
      // 结构演进兜底：没有逐镜字段时不报错，原样展示并明确说明。
      body = h("div", {}, [
        h("div", { class: "sub", text: "响应里没有逐镜字段，已回退原始 JSON（不臆造 ready/blocked）。" }),
        h("pre", { text: JSON.stringify(rep, null, 2) })
      ]);
    }
    var card = h("div", { class: "card", id: "plan-card" }, [
      h("div", { class: "card-head" }, [
        h("h3", { text: "02a 预检（零模型调用）" }),
        h("span", { class: "badge ok", text: "ready " + ready }),
        h("span", { class: "badge bad", text: "blocked " + blocked }),
        h("span", { class: "badge", text: "预计图片 " +
          (totals.images_total === undefined ? "?" : totals.images_total) }),
        h("div", { class: "spacer" }),
        h("span", { class: "sub", text: "ready=无需 02a 生成，不代表内容通过" })
      ]),
      body
    ]);
    var view = document.getElementById("view");
    var old = document.getElementById("plan-card");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    view.insertBefore(card, view.firstChild ? view.firstChild.nextSibling : null);
    return card;
  }

  function runPlan() {
    api("/api/plan", {}).then(function (res) {
      var rep = res.report || {};
      var totals = rep.totals || {};
      var pending = totals.images_total;
      toast("预检：本次预计生成 " + (pending === undefined ? "?" : pending) + " 张图（0 费用）");
      renderPlanReport(res);
    }).catch(function (err) { toast(err.message, true); });
  }

  function runCompose() {
    var input = document.getElementById("shots-input");
    var shots = input ? input.value.trim() : "";
    var log = document.getElementById("compose-log");
    if (log) log.textContent = "合成中…（本地 FFmpeg，无模型调用）";
    api("/api/compose", { shots: shots }).then(function (res) {
      if (log) log.textContent = res.log || "（无输出）";
      toast(res.ok ? "合成完成" : "合成失败（退出码 " + res.returncode + "）", !res.ok);
      return refresh();
    }).catch(function (err) {
      if (log) log.textContent = "失败：" + err.message;
      toast(err.message, true);
    });
  }

  document.getElementById("refresh").addEventListener("click", function () {
    refresh({ force: true }).then(function () { toast("已刷新"); });
  });

  var autoBtn = document.getElementById("auto");
  autoBtn.addEventListener("click", function () {
    state.auto = !state.auto;
    autoBtn.textContent = state.auto ? "自动刷新：开" : "自动刷新：关";
    autoBtn.className = state.auto ? "ghost on" : "ghost";
    toast(state.auto ? "自动刷新已开启（每 5 秒）" : "自动刷新已关闭");
  });
  setInterval(autopoll, 5000);

  refresh({ force: true });
})();
</script>
</body>
</html>
