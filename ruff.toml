# ruff 静态检查（2026-11-19 第 1 包）：只开会直接导致运行期 NameError 或
# 误导打桩的三类规则。门禁与基线见 tools/ruff_gate.py / tools/ruff_baseline.json。
# 不做 `ruff --fix`：F401 里有被测试打桩的名字（模块导入了但未直接使用），自动删除会让打桩失效。
target-version = "py310"
extend-exclude = [
    "baselines",
    "reference_skills",
    "tests",
    "tests_local",
    "docs",
    "output",
    ".tmp*",
    ".p1a_exp",
    ".pytest_tmp",
    "d12_work",
]

[lint]
select = ["F821", "F401", "F811"]
