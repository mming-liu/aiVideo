[pytest]
# 测试套件入口与临时目录治理（2026-10 复核 P0 配套，见 docs/aivideo_governance_plan.md §2.3）
testpaths = tests
python_files = test_*.py

markers =
    archived_replay: 依赖 fixtures/archived_runs/ 下**真跑黄金归档**的回放用例；
        归档缺失即失败（属检出损坏，见 docs/archive/step01-regression-delivery-boundary-2026-09-25.md 准则 7）。
        过渡期可用 `pytest -m "not archived_replay"` 排除它们取得核心回归读数。

# pytest **自己**的 tmp_path 回收策略：**刻意关闭**（保留 `none` 以留住这次结论）。
#
# ⚠️ 不要按旧计划改成 `tmp_path_retention_policy = failed`。实测（2026-10 复核）：
# 该策略会在会话进行中删掉**已通过**用例的 tmp_path 目录，而本仓库存在
# 「把 tmp_path 下的日志路径交给 `shared.tee_logger.get_logger(path)` 并在后续继续写」
# 的用法——目录被回收后写日志直接 `FileNotFoundError`，`tests/enhancements/` 之后跑
# `tests/step04_merge/test_narration_overlay.py` 会连带 **6 个用例转红**
# （错误点 `shared/tee_logger.py:67`，路径落在 `%TEMP%\pytest-of-*/pytest-N/<case>/...`）。
# 单独跑 step04 全绿、组合跑才红，正是「回收时机」而非功能问题。
tmp_path_retention_policy = none

# 注意：`.pytest_tmp` 的主要体量本来也不在 tmp_path 上——见下方说明。真正的回收在
# `tests/conftest.py` 的会话级治理（回收 `motion_*_<pid>` 隔离根 + 截断超限日志）。
#
# 2026-11-14 修正：旧实现的「单次会话删除预算 20 个**文件**」比一个隔离根
# （约 1,599 文件）还小，导致遗留根永远删不掉（`.pytest_tmp` 曾涨到 122.9 GB）。
# 现改为「根数 + 时间」预算 + 6 小时保留窗口，并同时回收旧 `--basetemp` 与
# `%TEMP%/pytest-of-<user>/pytest-N`；策略与工具共用 `shared/test_scratch.py`。
#
# 会话外彻底清盘（默认 dry-run，不删任何文件）：
#   python tools/cleanup_test_artifacts.py                 # 只出报告
#   python tools/cleanup_test_artifacts.py --apply         # 移入回收站（可逆）
#   python tools/cleanup_test_artifacts.py --apply --permanent  # 直接释放磁盘
#
# ⚠️ 长期证据（候选包/审计包/探针）不得放在 `.pytest_tmp/`：它是测试临时目录，
# 会被上述机制自动回收（2026-11-14 复核：U6 包曾放这里，整目录清理后需从
# baselines/2026-11-12-pre-layered/u6_frozen/ 恢复）。长期存放点用 `.dsh/` 或
# `baselines/`；历史目录若必须暂留，放一个 `.keep`（或 `KEEP`）文件作为安全网。
addopts = -ra --tb=short
