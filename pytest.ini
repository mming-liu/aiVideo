[pytest]
# 测试套件入口与临时目录治理（2026-10 复核 P0 配套，见 docs/aivideo_governance_plan.md §2.3）
testpaths = tests
python_files = test_*.py

# pytest **自己**的 tmp_path 回收策略：**刻意关闭**（保留 `none` 以留住这次结论）。
#
# ⚠️ 不要按旧计划改成 `tmp_path_retention_policy = failed`。实测（2026-10 复核）：
# 该策略会在会话进行中删掉**已通过**用例的 tmp_path 目录，而本仓库存在
# 「把 tmp_path 下的日志路径交给 `shared.tee_logger.get_logger(path)` 并在后续继续写」
# 的用法——目录被回收后写日志直接 `FileNotFoundError`，`tests/enhancements/` 之后跑
# `tests/step04_merge/test_narration_overlay.py` 会连带 **6 个用例转红**
# （错误点 `shared/tee_logger.py:67`，路径落在 `%TEMP%\pytest-of-*/pytest-N/<case>/...`）。
# 单独跑 step04 全绿、组合跑才红，正是「回收时机」而非功能问题。
tmp_path_retention_policy = none

# 注意：`.pytest_tmp` 的主要体量本来也不在 tmp_path 上——见下方说明。真正的回收在
# `tests/conftest.py` 的会话级治理（回收 `motion_*_<pid>` 隔离根 + 截断超限日志）。
addopts = -ra --tb=short
